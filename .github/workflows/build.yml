name: Build and Test

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        java-version: ['21']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Full history for version detection
    
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v3
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: maven
    
    - name: Display Maven version
      run: ./mvnw --version
    
    - name: Build with Maven (Dev Profile)
      run: |
        ./mvnw clean package \
          -Pdev \
          -DskipIntegrationTests=true \
          --batch-mode \
          --errors \
          --strict-checksums
      if: github.event_name == 'pull_request'
    
    - name: Test with Maven (Test Profile)
      run: |
        ./mvnw clean verify \
          -Ptest \
          --batch-mode \
          --errors \
          --strict-checksums
    
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results
        path: |
          target/surefire-reports/
          target/failsafe-reports/
          target/site/jacoco/
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      if: always()
      with:
        files: ./target/site/jacoco/jacoco.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Archive build artifacts
      uses: actions/upload-artifact@v3
      if: success()
      with:
        name: build-artifacts
        path: target/online-school-*.jar
        retention-days: 30
    
    - name: Comment PR with build status
      uses: actions/github-script@v6
      if: github.event_name == 'pull_request'
      with:
        script: |
          const fs = require('fs');
          const testResults = fs.existsSync('target/surefire-reports/TEST-*.xml');
          
          let comment = '### Build Status ✅\n\n';
          comment += '- **Build**: Passed\n';
          comment += '- **Tests**: Passed\n';
          comment += '- **Coverage**: [View Report](../../actions/runs/${{ github.run_id }})\n';
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          })

  production-build:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Build production artifact
      run: |
        ./mvnw clean package \
          -Pprod \
          -DskipTests \
          --batch-mode \
          --errors
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: target/online-school-*.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload to artifact registry
      run: |
        echo "Artifact ready for deployment"
        ls -lh target/online-school-*.jar
